paths:
  output_dir: '/local2/fredxu/FD-Bench/exps'  #* your path to save exp log and ckpt
  report_to: wandb    #* choices: ['wandb', 'tensorboard', 'all']
  tensorboard_dir: '/local2/fredxu/FD-Bench/runs/' #* path to save logs, if `report_to=tensorboard`

training:
  batch_size: 256
  epochs: 2000
  resume_step: 0
  checkpointing_steps: 500
  eval_steps: 20
  start_epoch: 0
  seed: 42
  num_workers: 4
  pin_mem: true

model:
  spa_mod: 'conv'  #* choices: ['self_atten', 'fourier', 'graph']
  tem_mod: 'next_step'      #* choices: ['linear', ]
  pred_tgt: 'variable'
  drop: 0.0
  drop_path: 0.1
  model_ema: false
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  
  # CNO
  in_dim: 1 # forcing + sol
  out_dim: 1 # sol
  size: 128 
  N_layers: 4
  N_res: 4
  channel_multiplier: 32

data:
  PDE_type: 'SPDE'      #* choices: ['CNS']
  data_path: '/local2/fredxu/FD-Bench/NS_u0_xi_nu4'                  #* your path to data
  data_set: '0.mat'       #* file_name
  input_size: 128
  in_chans: 1 # forcing + sol
  reduced_resolution: 1
  reduced_resolution_t: 1 
  reduced_batch: 1
  initial_step: 1

optimizer:
  opt: 'adamw'
  opt_eps: 1.0e-8
  opt_betas: null
  clip_grad: 1
  momentum: 0.9
  weight_decay: 0.05
  adam_beta1: 0.9
  adam_beta2: 0.999 
  adam_weight_decay: 0
  adam_epsilon: 1.0e-8


lr_scheduler:
  scheduler: 'lambda'    # ['CosineAnnealing','cyc','CosineAnnealingWarmRestarts']
  step_size_up: 1000
  step_size_down: 1000
  lr: 1.0e-3
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  warmup_lr: 1.0e-4
  min_lr: 5.0e-5
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1

distribution:
  gradient_accumulation_steps: 1
  allow_tf32: True
  mixed_precision: "fp16"