paths:
  output_dir: 'your_path/FD-Bench/exps'  #* your path to save exp log and ckpt
  report_to: 'wandb'    #* choices: ['wandb', 'tensorboard', 'all']
  tensorboard_dir: 'your_path/FD-Bench/runs/' #* path to save logs, if `report_to=tensorboard`

training:
  batch_size: 32 # cannot be 1
  epochs: 4000
  resume_step: 0
  checkpointing_steps: 2000
  eval_steps: 2000
  start_epoch: 0
  seed: 42
  num_workers: 0
  pin_mem: true

rollout:
  if_rollout: True
  roll_step: 12
  start_step: 0

model:
  spa_mod: 'latent'  #* choices: ['self_atten', 'fourier', 'graph', 'latent']
  tem_mod: 'next_step'      #* choices: ['linear', 'next_step']
  pred_tgt: 'variable'
  drop: 0.0                          # Dropout rate applied to feature layers (0.0 disables dropout)
  drop_path: 0.1                     # Drop path rate for stochastic depth regularization
  latent_dim: 16                     # Dimensionality of the latent (compressed) representation space n_z

  is_periodic: True                  # Whether the spatial domain is periodic (e.g., for periodic boundary conditions)

  encoder_channels: [64, 64, 64, 128, 128]  # Convolutional channel sizes in encoder; determines compression ratio

  fourier_resolutions: []           # Resolutions (frequencies) to retain; high frequencies are truncated if specified

  encoder_res_blocks: 6             # Number of residual blocks in the encoder

  use_attn_enc: False               # Whether to use attention layers in the encoder module

  use_fa: True                      # Whether to use Fourier Attention or Frequency-aware modules (if available)

  decoder_channels: [128, 128, 64, 64, 64]  # Channel sizes used in the decoder to reconstruct high-resolution outputs

  attn_resolutions: [32, 64]        # Spatial resolutions at which attention is applied (multi-scale attention)

  decoder_res_blocks: 6            # Number of residual blocks in the decoder

  final_smoothing: False           # Whether to apply final smoothing (e.g., low-pass filter) to the output

  attn_heads: 8                    # Number of heads in multi-head attention layers

  attn_dim: 512                    # Dimensionality of attention embeddings

  disable_coarse_attn: False       # Whether to disable coarse-resolution attention layers to save computation

  prop_n_block: 6                  # Number of propagation blocks in the latent space dynamics model (e.g., for latent evolution)

  prop_n_embd: 512                 # Embedding dimension used in the propagation module (e.g., transformer in latent space)

  dilation: 1                      # Dilation factor for convolutional layers; controls receptive field

  latent_resolution: 16            # Spatial resolution of the latent feature map (usually reduced from input resolution)

  Ly: 128                          # Height (y-axis) of the input/output spatial grid

  Lx: 128                          # Width (x-axis) of the input/output spatial grid

  resolution: 128                  # Base spatial resolution for both height and width (assumes square domain if Lx == Ly)

  # Ly: 256
  # Lx: 256
  # resolution: 256
  # latent_resolution: 32

data:
  PDE_type: 'CNS'      #* choices: ['CNS']
  data_path: 'your_path/FD-Bench/'                  #* your path to data
  data_set: '2D_CFD_Rand_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5'       #* file_name
  input_size: 128 
  in_chans: 4
  out_chans: 4 
  reduced_resolution: 4
  in_channels: 4   

  # PDE_type: 'DR'
  # data_path: 'your_path/PDEBench/data/2D/diffusion-reaction/'
  # data_set: '2D_diff-react_NA_NA.h5'
  # input_size: 128
  # in_chans: 2
  # in_channels: 2  
  # reduced_resolution: 1

  # PDE_type: 'KF'
  # data_path: 'your_path/FNS-KF/'
  # data_set: 'FNS-KF.nc'
  # num_trajectories: -1
  # max_trajectories: 1000
  # max_num_time_steps: 3
  # input_size: 128
  # in_chans: 5
  # in_channels: 5
  # reduced_resolution: 1
  
  reduced_resolution_t: 1 
  reduced_batch: 10
  initial_step: 1
  

optimizer:
  opt: 'adamw'
  opt_eps: 1.0e-8
  opt_betas: null
  clip_grad: 1
  momentum: 0.9
  weight_decay: 0.05
  adam_beta1: 0.9
  adam_beta2: 0.999 
  adam_weight_decay: 0
  adam_epsilon: 1.0e-8


lr_scheduler:
  scheduler: 'lambda' #*'CosineAnnealingWarmRestarts','cyc'
  step_size_up: 1000
  step_size_down: 1000
  lr: 1.0e-5
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  warmup_lr: 1.0e-3
  min_lr: 5.0e-4
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1

distribution:
  gradient_accumulation_steps: 1
  allow_tf32: True
  mixed_precision: "fp16"
