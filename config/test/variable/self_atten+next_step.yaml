paths:
  output_dir: '/wanghaixin/FD-Bench/exps'  #* your path to save exp log and ckpt
  report_to: wandb    #* choices: ['wandb', 'tensorboard', 'all']
  tensorboard_dir: '/wanghaixin/FD-Bench/runs/' #* path to save logs, if `report_to=tensorboard`

training:
  batch_size: 64
  resume_step: 14000
  seed: 42
  num_workers: 4
  pin_mem: true

model:
  spa_mod: 'self_atten'  #* choices: ['self_atten', 'fourier', 'graph']
  tem_mod: 'next_step'      #* choices: ['linear', ]
  pred_tgt: 'variable'
  drop: 0.0
  drop_path: 0.1
  model_ema: false
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  
  # Self-atten
  patch_size: 4
  num_attention_heads: 8
  hidden_size: 768
  embed_dim: 768
  num_layers: 12
  mixing_type: 'sa'  # choices: ['afno', 'sa', 'ls', 'gfn', 'bfno']
  fno_bias: false
  fno_blocks: 1
  fno_softshrink: 0.00
  double_skip: false
  checkpoint_activations: false
  ls_w: 4
  ls_dp_rank: 16

data:
  PDE_type: 'CNS'      #* choices: ['CNS']
  data_path: '/wanghaixin/PDEBench/data/2D/CFD/2D_Train_Rand/'                  #* your path to data
  data_set: '2D_CFD_Rand_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5'       #* file_name
  input_size: 128 
  in_chans: 4 
  reduced_resolution: 4
  reduced_resolution_t: 1 
  reduced_batch: 1
  initial_step: 1

distribution:
  gradient_accumulation_steps: 1
  allow_tf32: True
  mixed_precision: "fp16"