paths:
  output_dir: '/wanghaixin/FD-Bench/exps'
  tensorboard_dir: '/wanghaixin/FD-Bench/runs'
  autoresume: false
  resume: false
  report_to: 'tensorboard'

training:
  batch_size: 32
  epochs: 6000
  resume_step: 0
  checkpointing_steps: 2000
  eval_steps: 2000
  start_epoch: 0
  seed: 42
  num_workers: 0
  pin_mem: true

model:
  spa_mod: 'flow'
  tem_mod: 'next_step'
  pred_tgt: 'flow'
  drop: 0.0
  drop_path: 0.1
  model_ema: false
  model_ema_decay: 0.99996
  model_ema_force_cpu: false

  prediction: 'v'
  path_type: "linear"
  weighting: "uniform"

  denoiser_type: "self_attention"
  patch_size: 8
  num_heads: 8
  hidden_size: 512
  # embed_dim: 1024
  num_layers: 12
  mlp_ratio: 4
  qk_norm: False
  fused_attn: True
  eval_sample_steps: 50



data:
  PDE_type: 'CNS'      #* choices: ['CNS']
  data_path: '/wanghaixin/PDEBench/data/2D/CFD/2D_Train_Rand/'                #* your path to data
  data_set: '2D_CFD_Rand_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5' #* file_name
  input_size: 128  
  in_chans: 4
  finetune: ''
  reduced_resolution: 4
  denoiser_time_dim: 8

  # PDE_type: 'DR'
  # data_path: '/wanghaixin/PDEBench/data/2D/diffusion-reaction/'
  # data_set: '2D_diff-react_NA_NA.h5'
  # input_size: 128
  # in_chans: 2
  # reduced_resolution: 1
  # denoiser_time_dim: 4

  # PDE_type: 'KF'
  # data_path: '/wanghaixin/FNS-KF/'
  # data_set: 'FNS-KF.nc'
  # num_trajectories: -1
  # max_trajectories: 1000
  # max_num_time_steps: 3
  # input_size: 128
  # in_chans: 5
  # reduced_resolution: 1
  # denoiser_time_dim: 10

  window_size: 1
  reduced_resolution_t: 1 
  reduced_batch: 1
  initial_step: 1

optimizer:
  opt: 'adamw'
  opt_eps: 1.0e-8
  opt_betas: null
  clip_grad: 1
  momentum: 0.9
  weight_decay: 0.05
  adam_beta1: 0.9
  adam_beta2: 0.999 
  adam_weight_decay: 0
  adam_epsilon: 1.0e-8

lr_scheduler:
  scheduler: 'lambda'
  lr: 1.0e-4
  step_size_up: 1000
  step_size_down: 1000
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  warmup_lr: 5.0e-4
  min_lr: 5.0e-5
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1


augmentation:
  color_jitter: 0.4
  aa: 'rand-m9-mstd0.5-inc1'
  smoothing: 0.1
  train_interpolation: 'bicubic'
  repeated_aug: false
  
  # Random Erase
  reprob: 0
  remode: 'pixel'
  recount: 1
  resplit: false
  
  # Mixup
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: 'batch'

distribution:
  gradient_accumulation_steps: 1
  allow_tf32: True
  mixed_precision: "no"
