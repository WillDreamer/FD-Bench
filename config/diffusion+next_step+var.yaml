paths:
  output_dir: '../ckpt'
  tensorboard_dir: '../FD-Bench/runs/'
  autoresume: false
  resume: false

training:
  batch_size: 2
  epochs: 100
  start_epoch: 0
  eval: false
  use_amp: true
  dist_eval: true
  device: 'cuda'
  seed: 0
  num_workers: 4
  pin_mem: true

model:
  spa_mod: 'diffusion'
  tem_mod: 'next_step'
  drop: 0.0
  drop_path: 0.1
  model_ema: false
  model_ema_decay: 0.99996
  model_ema_force_cpu: false
  
  beta_min: 0.0001
  beta_max: 0.02
  timesteps: 1000
  sample_method: "ddpm"

  denoiser_ch: 64
  denoiser_out_ch: 4
  denoiser_ch_mult: [1, 1, 1, 2]
  denoiser_num_res_blocks: 1
  denoiser_attn_resolutions: [16,]
  denoiser_dropout: 0.0
  denoiser_in_channels: 8
  denoiser_resamp_with_conv: True



data:
  PDE_type: 'CNS'      #* choices: ['CNS']
  data_path: '/local2/shared_data/DBench_data/PDEBench/'                  #* your path to data
  data_set: '2D_CFD_Turb_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5' #* file_name
  input_size: 128  
  in_chans: 4
  finetune: ''
  reduced_resolution: 4
  reduced_resolution_t: 1 
  reduced_batch: 1
  initial_step: 10

optimizer:
  opt: 'adamw'
  opt_eps: 1.0e-8
  opt_betas: null
  clip_grad: 1
  momentum: 0.9
  weight_decay: 0.05


lr_scheduler:
  sched: 'cosine'
  lr: 5.0e-4
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  warmup_lr: 1.0e-6
  min_lr: 1.0e-5
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1


augmentation:
  color_jitter: 0.4
  aa: 'rand-m9-mstd0.5-inc1'
  smoothing: 0.1
  train_interpolation: 'bicubic'
  repeated_aug: false
  
  # Random Erase
  reprob: 0
  remode: 'pixel'
  recount: 1
  resplit: false
  
  # Mixup
  mixup: 0.8
  cutmix: 1.0
  cutmix_minmax: null
  mixup_prob: 1.0
  mixup_switch_prob: 0.5
  mixup_mode: 'batch'

distributed:
  world_size: 1
  dist_url: 'env://'
