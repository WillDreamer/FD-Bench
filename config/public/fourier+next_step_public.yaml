paths:
  output_dir: 'exps/'  #* your path to save exp log and ckpt
  report_to: tensorboard   #* choices: ['wandb', 'tensorboard', 'all']
  tensorboard_dir: 'runs/' #* path to save logs, if `report_to=tensorboard`

training:
  batch_size: 64
  epochs: 600
  resume_step: 0
  checkpointing_steps: 2000
  eval_steps: 2000
  start_epoch: 0
  seed: 42
  num_workers: 0
  pin_mem: true

rollout:
  if_rollout: True
  roll_step: 10
  start_step: 5

model:
  spa_mod: 'fourier'  
  tem_mod: 'next_step'      
  pred_tgt: 'variable'
  n_modes: [24, 24]
  hidden_channels: 256
  width: 48
  n_layers: 12


data:
  PDE_type: 'CNS'      
  data_path: '/wanghaixin/PDEBench/data/2D/CFD/2D_Train_Rand/'                  #* your path to data
  data_set: '2D_CFD_Rand_M0.1_Eta1e-08_Zeta1e-08_periodic_512_Train.hdf5'       #* file_name
  input_size: 128 
  in_chans: 6 
  out_chans: 4
  reduced_resolution: 4

  # PDE_type: 'CNS'      #* choices: ['CNS']
  # data_path: 'your_path/PDEBench/data/2D/CFD/2D_Train_Rand/'                  #* your path to data
  # data_set: '2D_CFD_Rand_M0.1_Eta0.1_Zeta0.1_periodic_128_Train.hdf5'       #* file_name
  # input_size: 128 
  # in_chans: 4 
  # reduced_resolution: 1
  
  # PDE_type: 'DR'
  # data_path: 'your_path/PDEBench/data/2D/diffusion-reaction/'
  # data_set: '2D_diff-react_NA_NA.h5'
  # input_size: 128
  # in_chans: 2
  # reduced_resolution: 1

  # PDE_type: 'Well'
  # well_dataset_name: "shear_flow"
  # data_path: 'your_path/well/datasets/'
  # data_set: 'shear_flow_Reynolds_1e5_Schmidt_1e1.hdf5'
  # input_size: 128
  # in_chans: 4
  # reduced_resolution: 2

  # PDE_type: 'KF'
  # data_path: '/wanghaixin/FNS-KF/'
  # data_set: 'FNS-KF.nc'
  # num_trajectories: -1
  # max_trajectories: 1000
  # max_num_time_steps: 3
  # input_size: 128
  # in_chans: 5
  # out_chans: 5
  # reduced_resolution: 1
  
  reduced_resolution_t: 1 
  reduced_batch: 1
  initial_step: 1

optimizer:
  opt: 'adamw'
  opt_eps: 1.0e-8
  opt_betas: null
  clip_grad: 1
  momentum: 0.9
  weight_decay: 0.05
  adam_beta1: 0.9
  adam_beta2: 0.999 
  adam_weight_decay: 0
  adam_epsilon: 1.0e-8


lr_scheduler:
  # scheduler: 'CosineAnnealing'
  scheduler: 'lambda'
  step_size_up: 1000
  step_size_down: 1000
  lr: 1.0e-3
  lr_noise: null
  lr_noise_pct: 0.67
  lr_noise_std: 1.0
  warmup_lr: 1.0e-3
  min_lr: 5.0e-4
  decay_epochs: 30
  warmup_epochs: 5
  cooldown_epochs: 10
  patience_epochs: 10
  decay_rate: 0.1

distribution:
  gradient_accumulation_steps: 1
  allow_tf32: True
  mixed_precision: "no"
